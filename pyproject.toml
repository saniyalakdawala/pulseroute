[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-route-ai"
version = "0.1.0"
description = "Local-first transit delay prediction and model operations demo"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas==2.3.1", "numpy==2.2.6", "scipy==1.16.1", "scikit-learn==1.6.0", "joblib==1.5.1", "pyarrow>=14", "mlflow>=2.10", "fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.32", "prometheus-client>=0.20", "requests>=2.31", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
